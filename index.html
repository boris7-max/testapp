<!-- index.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BROWN-LINK</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="starfield"></div>

    <!-- Экран доступа -->
    <div id="access-screen" class="key-system-overlay">
        <div class="key-card">
            <div class="key-header">
                <i class="fab fa-telegram"></i>
                <h2>Доступ к BROWN-LINK</h2>
            </div>
            <p class="key-description">
                Для получения доступа перейдите в Telegram.<br>
                Доступ выдаётся по ID устройства.
            </p>
            <button class="btn btn-purple" id="tg-btn">
                <i class="fab fa-telegram"></i> Перейти в Telegram
            </button>
            <p class="key-description" id="device-id-text"></p>
        </div>
    </div>

    <!-- Прелоадер -->
    <div id="site-loader" class="site-loader-overlay hidden">
        <div class="loader-card">
            <div class="loader-animation">
                <div class="loader">
                    <div></div><div></div><div></div><div></div><div></div>
                </div>
            </div>
            <h3>Загрузка...</h3>
            <p class="loader-subtitle">Инициализация</p>
            <div class="loader-progress">
                <div class="progress-bar" id="site-progress"></div>
            </div>
            <p class="loader-timer" id="site-loader-timer">0%</p>
        </div>
    </div>

    <!-- ОСНОВНОЕ ПРИЛОЖЕНИЕ (НЕ ТРОНУТО) -->
    <div class="container" id="main-content" style="display:none;">
        <!-- ВЕСЬ ОСТАЛЬНОЙ КОД БЕЗ ИЗМЕНЕНИЙ -->
        <!-- ⬇⬇⬇ ТВОЙ ИСХОДНЫЙ MAIN CONTENT ⬇⬇⬇ -->
    </div>

    <script src="script.js"></script>
</body>
</html>
